car_detector:
  weights_path: "weights/horizon_car.pt" # Path to the car detection model weights
  img_size: 1280
  conf_thres: 0.2
  iou_thres: 0.5
  max_det: 10
  tracker_config_path: "config/botsort.yaml" # Path to the tracker configuration file
  

armor_detector:
  class_names: ["B1", "B2", "B3", "B4", "B7", "R1", "R2", "R3", "R4", "R7", "G1", "G2", "G3", "G4", "G7"]
  use_enhanced_detector: true
  armor_detector_type: "two_step" # three_step, three_step

  ##### Weights and size configuration for three step detector
  # weights_path: "weights/armor_pfa_dynamic.engine"
  # img_size: [640, 640]
  
  ##### Weights and size configuration for two step detector
  weights_path: "weights/armor.pt" 
  img_size: 192
  
  ##### Weights and size configuration END

  ##### Post processing configuration for yolo-based detector
  conf_thres: 0.3
  iou_thres: 0.4
  max_det: 1
  digit_model_type: "mobilenet"
  digit_weights_path: "weights/armor_pattern.pth"

tracker:
  type: "CascadeMatchTracker"
  point_guesser_config_path: "config/guess_pts.yaml"

device: "cuda"
transform:
  K: [[5267.067496, 0.0, 2595.34351], [0.0, 5289.319877, 1835.457692], [0.0, 0.0, 1.0]]
  dist_coeffs: [-0.042089, 0.163844, 0.001424, 0.000762, 0.0]
  
  verbose: true

  ## The below parameters are only used for mimic or demostration purposes
  R: [[0.99530147, -0.03039188, -0.09193101],
      [-0.01339114, -0.98354371, 0.18017339],
      [-0.09589397, -0.17809578, -0.97932948],]
  t: [[-0.68605672], [1.13893625], [15.32698638]]
  demo_img_path: "demo/demo3.jpg" 
  # field background image is hardcoded in core.py FieldProjectionWidget's init().

field:
  mesh_path: "field/RMUC2026.ply"
  keypoints: "transform/keypoint_6.txt" ## 区域赛场地关键点文件
  
referee:
  # port: "/dev/ttyCH341USB0"   ## 串口第一默认写入文件
  port: "/dev/ttyACM0"
  # port: "/dev/ttyV0"          ## 串口第二默认写入文件
  baudrate: 115200            ## 串口波特率

debug:
  inference_video: true #true                   # 是否启用视频推理
  # video_source: "/home/etmphile/Desktop/img_to_vid/mock_highres.mp4"  # 视频源路径
  video_source: "ssd/referee_logs/saved_images_2026-05-28_15:28:11.729.mp4"
  streaming_video: false                 # 是否录制视频


  






 



